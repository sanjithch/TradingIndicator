<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Support &amp; Resistance Dashboard</title>
<link rel="stylesheet" href="style.css" />
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<header>
  <h1>Support &amp; Resistance Dashboard</h1>
  <p id="run-meta" class="muted">Loading&hellip;</p>
  <nav id="view-tabs">
    <button type="button" class="tab active" data-view="holdings">My Holdings</button>
    <button type="button" class="tab" data-view="watchlist">Watchlist</button>
  </nav>
</header>

<section id="metrics">
  <div class="metric-card">
    <h2>Level hold rate</h2>
    <div id="hold-rate-chart" class="metric-chart"></div>
    <p id="hold-rate-empty" class="muted" hidden>Not enough history yet &mdash; needs at least two runs.</p>
  </div>
  <div class="metric-card">
    <h2>Signal count (latest run)</h2>
    <div id="signal-counts"></div>
  </div>
</section>

<section id="table-section">
  <table id="levels-table">
    <thead>
      <tr>
        <th>Symbol</th>
        <th>Price</th>
        <th>Support</th>
        <th>% to S</th>
        <th>Resistance</th>
        <th>% to R</th>
        <th>Strike</th>
        <th>Signal</th>
      </tr>
    </thead>
    <tbody id="levels-body"></tbody>
  </table>
</section>

<section id="chart-section" hidden>
  <div class="chart-header">
    <h2 id="chart-symbol"></h2>
    <button id="chart-close" aria-label="Close chart">&times;</button>
  </div>
  <div id="candlestick-chart"></div>
</section>

<script src="app.js"></script>
</body>
</html>
